<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRT · WebGL demo</title>
<style>
:root{color-scheme:dark;font:14px/1.6 ui-monospace,monospace;color:#d7e7dc;background:#000}*{box-sizing:border-box}body{margin:0}#screen{position:fixed;inset:24px;background:#0d1511;isolation:isolate}#signal{position:absolute;inset:0;width:100%;height:100%}article{position:absolute;z-index:2;left:8%;top:9%;max-width:420px;padding:24px;background:#0d1511e6;border:1px solid #577860}h1{font-size:36px;line-height:1.1}a{color:#d7d19a}label{display:flex;justify-content:space-between;gap:20px;margin:16px 0}button,input{font:inherit}input{accent-color:#a6d5a4}button{background:#20372a;border:1px solid #6d9477;color:inherit;padding:8px}small{display:block;margin-top:20px;color:#8fa895}@media(max-width:600px){#screen{inset:12px}article{left:7%;right:7%;padding:18px}h1{font-size:28px}}
</style>
<div id="screen"><canvas id="signal" aria-hidden="true"></canvas><article><small>DEDICATED GPU POSTPROCESSING</small><h1>One piece of glass.</h1><p>The animated grid and this selectable HTML share one screen-wide curvature field.</p><label>CRT effect<input id="enabled" type="checkbox" checked></label><label>Curvature<input id="curvature" type="range" min="0" max=".12" step=".005" value=".035"></label><button id="lifecycle">Destroy effect</button><small id="status"></small><p><a href="../">Live HTML demo</a></p></article></div>
<script type="module">
import {createCRT,createWebGLCRT} from '../dist/crt-effect.js';
const screen=document.querySelector('#screen'),canvas=document.querySelector('#signal'),ctx=canvas.getContext('2d'),panel=document.querySelector('article');
const enabled=document.querySelector('#enabled'),curve=document.querySelector('#curvature'),button=document.querySelector('#lifecycle'),status=document.querySelector('#status');
let gpu,html,frame=0,last=0;
function create(){gpu=createWebGLCRT(screen,{sources:[canvas],aperture:true,curvature:+curve.value,enabled:enabled.checked});html=createCRT(panel,{viewport:screen,curvature:+curve.value,grain:0,scanlines:0,mask:0,vignette:0,glow:0,protect:'',enabled:enabled.checked});status.textContent=gpu.renderer+' · live HTML + canvas';window.gpu=gpu;}
function draw(t=0){frame=0;const d=Math.min(devicePixelRatio,2),w=screen.clientWidth,h=screen.clientHeight;if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#0d1511';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#35523f';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<w;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,h)}for(let y=0;y<h;y+=40){ctx.moveTo(0,y);ctx.lineTo(w,y)}ctx.stroke();ctx.strokeStyle='#c3edb1';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<w;x++){const y=h*.65+Math.sin(x*.018+t*.0015)*h*.12;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();gpu?.render();}
const motion=matchMedia('(prefers-reduced-motion:reduce)');function tick(t){if(t-last>1000/30){draw(t);last=t}if(!document.hidden&&!motion.matches)frame=requestAnimationFrame(tick)}function resume(){cancelAnimationFrame(frame);draw();if(!document.hidden&&!motion.matches)frame=requestAnimationFrame(tick)}
enabled.onchange=()=>{gpu?.setEnabled(enabled.checked);html?.setEnabled(enabled.checked)};curve.oninput=()=>{gpu?.update({curvature:+curve.value});html?.update({curvature:+curve.value})};button.onclick=()=>{if(gpu){gpu.destroy();html.destroy();gpu=html=null;window.gpu=null;button.textContent='Recreate effect';status.textContent='Original styles restored'}else{create();button.textContent='Destroy effect';draw()}};
new ResizeObserver(()=>requestAnimationFrame(()=>draw())).observe(screen);document.addEventListener('visibilitychange',resume);motion.addEventListener('change',resume);draw();create();resume();
</script></html>
